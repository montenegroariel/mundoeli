services:
  docs:
    image: mundoeli_local_docs
    container_name: mundoeli_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./mundoeli:/app/mundoeli:z
    ports:
      - '9000:9000'
    command: /start-docs
