volumes:
  mundoeli_local_postgres_data: {}
  mundoeli_local_postgres_data_backups: {}
  

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: mundoeli_local_django
    container_name: mundoeli_local_django
    depends_on:
      - postgres
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
      - "5679:5679"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: mundoeli_production_postgres
    container_name: mundoeli_local_postgres
    volumes:
      - mundoeli_local_postgres_data:/var/lib/postgresql/data
      - mundoeli_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
